<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Gestión de Usuarios</h1>

    <form id="formulario">
        <input type="hidden" id="id">
        
        <div class="campo">
            <input type="text" id="nombre" placeholder="Nombre">
            <small id="errorNombre" class="mensaje-error"></small>
        </div>
        
        <div class="campo">
            <input type="number" id="edad" placeholder="Edad">
            <small id="errorEdad" class="mensaje-error"></small>
        </div>

        <div class="campo">
            <input type="email" id="email" placeholder="Correo Electrónico">
            <small id="errorEmail" class="mensaje-error"></small>
        </div>
        
        <button type="submit" id="btnGuardar">Agregar</button>
        <button type="button" id="btnCancelar" class="oculto">Cancelar</button>
    </form>

    <table id="tabla">
        <thead>
            <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>EDAD</th>
                <th>CORREO ELECTRÓNICO</th>
                <th>ACCIONES</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="main.js"></script>
</body>
</html>
