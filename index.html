<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> 
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Gestión de Usuarios</h1>

    <form id="formulario">
        <input type="hidden" id="id">
        
        <div class="campo">
            <input type="text" id="nombre" placeholder="Nombre">
            <small id="errorNombre" class="mensaje-error"></small>
        </div>
        
        <div class="campo">
            <input type="number" id="edad" placeholder="Edad">
            <small id="errorEdad" class="mensaje-error"></small>
        </div>

        <div class="campo">
            <input type="email" id="email" placeholder="Correo Electrónico">
            <small id="errorEmail" class="mensaje-error"></small>
        </div>
        
        <button type="submit" id="btnGuardar">
            <i class="bi bi-plus-circle"></i>
            <span>Agregar</span>
        </button>
        <button type="button" id="btnCancelar" class="oculto">
            <i class="bi bi-x-lg"></i>
            <span>Cancelar</span>
        </button>
    </form>

    <div class="filtros">
        <div class="campo-filtro">
            <label for="busqueda">Buscar</label>
            <div class="input-busqueda">
                <i class="bi bi-search"></i>
                <input type="text" id="busqueda" placeholder="Nombre o Correo Electrónico">
            </div>
        </div>

        <div class="campo-filtro">
            <label for="filtroEdad">Filtrar por edad</label>
            <select id="filtroEdad">
                <option value="">Todas las edades</option>
                <option value="1-17">1 - 17 años</option>
                <option value="18-30">18 - 30 años</option>
                <option value="31-50">31 - 50 años</option>
                <option value="51-99">51 - 99 años</option>
            </select>
        </div>

        <button type="button" id="btnLimpiarFiltros">
            <i class="bi bi-arrow-counterclockwise"></i>
            <span>Limpiar</span>
        </button>
    </div>

    <p id="contadorResultados"></p>

    <table id="tabla">
        <thead>
            <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>EDAD</th>
                <th>CORREO ELECTRÓNICO</th>
                <th>ACCIONES</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="main.js"></script>
</body>
</html>
