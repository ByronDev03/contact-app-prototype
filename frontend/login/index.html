<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/frontend/login/styles.css">
</head>

<body>
    <main class="page">
        <section class="auth-card" aria-label="Autenticación">
            <div class="auth-card__inner">
                <!-- =========================
                    LOGIN
                ========================== -->
                <div class="auth-face auth-face--front">
                    <div class="auth-content">
                        <div class="brand">
                            <div class="brand__icon">
                                <i class="bi bi-person-fill"></i>
                            </div>
                        </div>

                        <div class="auth-header">
                            <p class="auth-header__eyebrow">Welcome back</p>
                            <h1>Sign in</h1>
                            <p>Enter your details to continue.</p>
                        </div>

                        <form id="loginForm" class="auth-form">

                            <!-- EMAIL -->
                            <div class="form-group">
                                <div class="input-wrapper">
                                    <i class="bi bi-envelope"></i>
                                    <input type="email" id="loginEmail" placeholder=" " autocomplete="email">
                                    <label for="loginEmail" class="floating-label">Email</label>
                                </div>
                                <small id="loginEmailError" class="form-error"></small>
                            </div>

                            <!-- PASSWORD -->
                            <div class="form-group">
                                <div class="input-wrapper">
                                    <i class="bi bi-lock"></i>
                                    <input type="password" id="loginPassword" placeholder=" " autocomplete="current-password">
                                    <label for="loginPassword" class="floating-label">Password</label>
                                    <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Mostrar contraseña">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <small id="loginPasswordError" class="form-error"></small>
                            </div>

                            <!-- OPCIONES -->
                            <div class="form-options">
                                <label class="remember">
                                    <input type="checkbox" id="remember">
                                    <span>Remember me</span>
                                </label>
                                <a href="#" id="forgotPassword">Forgot your password?</a>
                            </div>

                            <!-- BOTÓN -->
                            <button type="submit" class="btn btn--primary">
                                <span>Sign in</span>
                            </button>

                            <!-- CAMBIAR A REGISTRO -->
                            <p class="switch-text">Don't have an account?
                                <button type="button" class="switch-button" id="showRegister">Create account</button>
                            </p>
                        </form>
                    </div>
                </div>


                <!-- =========================
                     REGISTRO
                ========================== -->
                <div class="auth-face auth-face--back">
                    <div class="auth-content">
                        <div class="auth-header">
                            <p class="auth-header__eyebrow">Get started</p>
                            <h2>Create account</h2>
                            <p>Create an account to get started.</p>
                        </div>

                        <form id="registerForm" class="auth-form">

                            <!-- NOMBRE -->
                            <div class="form-group">
                                <div class="input-wrapper">
                                    <i class="bi bi-person"></i>
                                    <input type="text" id="registerName" placeholder=" " autocomplete="name">
                                    <label for="registerName" class="floating-label">Full name</label>
                                </div>
                                <small id="registerNameError" class="form-error"></small>
                            </div>

                            <!-- EMAIL -->
                            <div class="form-group">
                                <div class="input-wrapper">
                                    <i class="bi bi-envelope"></i>
                                    <input type="email" id="registerEmail" placeholder=" " autocomplete="email">
                                    <label for="registerEmail" class="floating-label">Email</label>
                                </div>
                                <small id="registerEmailError" class="form-error"></small>
                            </div>

                            <!-- PASSWORD -->
                            <div class="form-group">
                                <div class="input-wrapper">
                                    <i class="bi bi-lock"></i>
                                    <input type="password" id="registerPassword" placeholder=" " autocomplete="new-password">
                                    <label for="registerPassword" class="floating-label">Password</label>
                                    <button type="button" class="password-toggle" data-target="registerPassword" aria-label="Mostrar contraseña">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div> 
                                <small id="registerPasswordError" class="form-error"></small>
                            </div>

                            <!-- BOTÓN -->
                            <button type="submit" class="btn btn--primary">
                                <span>Create account</span>
                            </button>

                            <!-- VOLVER A LOGIN -->
                            <p class="switch-text">Already have an account?
                                <button type="button" class="switch-button" id="showLogin">Sign in</button>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- MENSAJE -->
    <div class="toast" id="toast" role="status" aria-live="polite">
        <i class="bi bi-check-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <script src="/frontend/login/main.js"></script>
</body>
</html>
